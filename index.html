<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>hello.</title>
  <style>
    /* Base Terminal Styles */
    body {
      background-color: #000000;
      color: #00FF00;
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    html {
      cursor: text;
    }

    /* Header Layout */
    .header-container {
      display: flex;
      align-items: flex-end;
      margin-bottom: 30px;
    }

    .intro-gif {
      max-width: 150px;
      margin-right: 20px;
      display: block;
    }

    .greeting {
      color: #00FF00;
      white-space: pre;
      line-height: 1.5;
      padding-bottom: 10px;
    }

    /* Output Area */
    #output {
      margin-bottom: 10px;
    }

    .history-line {
      margin: 10px 0;
      word-wrap: break-word;
    }

    .prompt {
      color: #00FF00; /* Changed from #fff to green */
      margin-right: 8px;
    }

    .cmd-text {
      color: #00FF00; /* Changed from #fff to green */
    }

    /* Dynamic Output Elements */
    .error-msg {
      background-color: #0000CC;
      color: #fff;
      padding: 2px 6px;
      display: inline-block;
      margin: 10px 0;
      word-wrap: break-word;
      max-width: 100%;
    }

    .info-msg {
      color: #fff;
      margin: 10px 0;
      word-wrap: break-word;
    }

    .cmd-badge {
      background-color: #222222;
      color: #00FF00;
      padding: 2px 6px;
      margin-right: 5px;
      margin-bottom: 5px;
      display: inline-block;
    }

    .social-gif {
      max-width: 250px; /* Limits the size of the social GIFs */
      margin: 10px 0;
      display: block;
    }

    ul.social-list {
      list-style-type: disc;
      color: #fff;
      margin: 10px 0 10px 20px;
      padding: 0;
    }

    ul.social-list a {
      color: #3333FF;
      word-wrap: break-word;
    }

    /* Input Line */
    #cmd-form {
      display: flex;
      align-items: center;
      margin: 0;
      padding-bottom: 20px;
    }

    #cmd-input {
      background: transparent;
      border: none;
      color: #00FF00; /* Changed text color to green */
      caret-color: #00FF00; /* Forces the blinking cursor to be green */
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      outline: none;
      flex-grow: 1;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Header with GIF and Greeting -->
  <div class="header-container">
    <img src="intro.gif" alt="INTRO GIF" class="intro-gif">
    <div class="greeting">hello
type "help" for socials</div>
  </div>

  <!-- Terminal Output Area -->
  <div id="output"></div>

  <!-- Active Input Line -->
  <form id="cmd-form">
    <span class="prompt">$</span>
    <input type="text" id="cmd-input" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" autofocus>
  </form>

  <script>
    const input = document.getElementById('cmd-input');
    const output = document.getElementById('output');
    const form = document.getElementById('cmd-form');

    // Focus input when clicking anywhere, EXCEPT when clicking on a link
    document.addEventListener('click', (e) => {
      if (e.target.tagName !== 'A') {
        input.focus();
      }
    });

    // Handle command execution
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const cmd = input.value.trim();
      
      if (cmd) {
        processCommand(cmd);
      } else {
        output.innerHTML += `<div class="history-line"><span class="prompt">$</span></div>`;
      }
      
      input.value = '';
      window.scrollTo(0, document.body.scrollHeight);
    });

    function processCommand(cmd) {
      const cleanCmd = cmd.toLowerCase();
      output.innerHTML += `<div class="history-line"><span class="prompt">$</span><span class="cmd-text">${cmd}</span></div>`;

      switch(cleanCmd) {
        case 'help':
        case 'commands':
          output.innerHTML += `
            <div class="info-msg">Here is the list of available commands you can try</div>
            <div style="margin-bottom: 20px;">
              <span class="cmd-badge">clear</span>
              <span class="cmd-badge">instagram</span>
              <span class="cmd-badge">session</span>
              <span class="cmd-badge">spotify</span>
              <span class="cmd-badge">email</span>
            </div>
          `;
          break;

        case 'instagram':
          output.innerHTML += `
            <img src="instagram.gif" alt="Instagram GIF" class="social-gif">
            <ul class="social-list">
              <li><a href="https://instagram.com/1chrisgeorge" target="_blank">https://instagram.com/1chrisgeorge</a></li>
            </ul>
          `;
          break;

        case 'session':
          output.innerHTML += `
            <img src="session.gif" alt="Session GIF" class="social-gif">
            <ul class="social-list">
              <li><a href="https://twitter.com/yourhandle" target="_blank">https://twitter.com/yourhandle</a></li>
            </ul>
          `;
          break;

        case 'spotify':
          output.innerHTML += `
            <img src="spotify.gif" alt="Spotify GIF" class="social-gif">
            <ul class="social-list">
              <li><a href="https://open.spotify.com/user/31joafmn24gq5ihgmslduyzse2em?si=548ffe59df3a4976" target="_blank">https://open.spotify.com/user/31joafmn24gq5ihgmslduyzse2em?si=548ffe59df3a4976</a></li>
            </ul>
          `;
          break;

        case 'email':
          output.innerHTML += `
            <img src="email.gif" alt="Email GIF" class="social-gif">
            <ul class="social-list">
              <li><a href="mailto:hello@example.com" target="_blank">hello@example.com</a></li>
            </ul>
          `;
          break;

        case 'clear':
          output.innerHTML = '';
          break;

        default:
          output.innerHTML += `
            <div class="error-msg">-t "${cmd}": command was not found. Try writing "help" or "commands"</div>
          `;
      }
    }
  </script>
</body>
</html>
